<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Видеоигр - Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background-color: #333;
        color: #fff;
    }

    .logo img {
        height: 40px;
    }

    .menu-button {
        font-size: 30px;
        cursor: pointer;
    }

    .side-menu {
        position: fixed;
        top: 0;
        right: -250px;
        width: 250px;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 20px;
        transition: right 0.3s ease;
    }

    .side-menu ul {
        list-style-type: none;
    }

    .side-menu ul li {
        margin: 20px 0;
    }

    .side-menu ul li a {
        color: #fff;
        text-decoration: none;
        font-size: 18px;
    }

    #carousel {
        padding: 20px;
    }

    .carousel-container {
        display: flex;
        overflow: hidden;
        position: relative;
        width: 100%;
        justify-content: center;
    }

    .carousel-card {
        margin: 0 10px;
        transition: transform 0.3s ease;
    }

    .carousel-card img {
        width: 200px;
        height: 300px;
        object-fit: cover;
        border-radius: 10px;
    }

    .game-info {
        text-align: center;
    }

    .price {
        font-size: 18px;
        margin: 5px 0;
    }

    .old-price {
        text-decoration: line-through;
        color: red;
    }

    .add-to-cart {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 5px;
    }

    footer {
        display: flex;
        justify-content: space-between;
        position: fixed;
        bottom: 0;
        width: 100%;
        padding: 10px;
        background-color: #333;
        color: #fff;
    }

    footer .user-profile,
    footer .cart {
        font-size: 18px;
    }

    #about {
        padding: 20px;
        text-align: center;
    }

    #about h2 {
        margin-bottom: 10px;
    }

    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Логотип магазина">
        </div>
        <div class="menu-button" onclick="toggleMenu()">
            ☰
        </div>
    </header>

    <div id="side-menu" class="side-menu">
        <ul>
            <li><a href="#about">О нас</a></li>
            <li><a href="#catalog">Каталог</a></li>
            <li><a href="#contact">Контакты</a></li>
        </ul>
    </div>

    <section id="carousel">
        <div class="carousel-container">
            <div class="carousel-card">
                <img src="images/game1.jpg" alt="Игра 1">
                <div class="game-info">
                    <h3>Игра 1</h3>
                    <p class="price">
                        <span class="old-price">1500 ₽</span> 1200 ₽
                    </p>
                    <button class="add-to-cart">+</button>
                </div>
            </div>
            <!-- Повторить для других игр -->
        </div>
    </section>

    <section id="about">
        <h2>О нас</h2>
        <p>Мы продаем лучшие видеоигры для всех платформ!</p>
    </section>

    <footer>
        <div class="user-profile">
            <p>Профиль</p>
        </div>
        <div class="cart">
            <p>Корзина: 3000 ₽</p>
        </div>
    </footer>

    <script src="script.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

       // Открытие/закрытие меню
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            if (menu.style.right === '0px') {
                menu.style.right = '-250px';
            } else {
                menu.style.right = '0';
            }
        }

        // Смена карточек в карусели
        let currentCard = 0;
        const cards = document.querySelectorAll('.carousel-card');
        setInterval(() => {
            // Убираем старую большую карточку
            cards[currentCard].style.transform = 'scale(0.8)';
            currentCard = (currentCard + 1) % cards.length;
            // Добавляем новую большую карточку
            cards[currentCard].style.transform = 'scale(1)';
        }, 3000);

        // Пример добавления товара в корзину
        const addButtons = document.querySelectorAll('.add-to-cart');
        addButtons.forEach(button => {
            button.addEventListener('click', () => {
                alert('Игра добавлена в корзину!');
            });
        });
    </script>
</body>
</html>

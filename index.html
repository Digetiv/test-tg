<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo Switch - Топ продаж</title>
    <style>
        :root {
            --tg-theme-bg-color: #1c1c1d;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #98989e;
            --tg-theme-link-color: #5ac8fa;
            --tg-theme-button-color: #5ac8fa;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #2c2c2e;
        }
        
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            line-height: 1.4;
        }
        
        .header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 20px 0 12px 0;
            color: var(--tg-theme-hint-color);
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .product-card {
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 10px;
            padding: 12px;
        }
        
        .product-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .product-details {
            font-size: 12px;
            color: var(--tg-theme-hint-color);
        }
        
        .single-product {
            background-color: var(--tg-theme-secondary-bg-color);
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
        }
        
        .price {
            font-size: 14px;
            font-weight: bold;
            color: var(--tg-theme-button-color);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">Новые ограничения: как бороться с сетевой ошибкой на Nintendo Switch (2155-2000 и пр.).</div>
    
    <div class="section-title">Топ продаж!</div>
    <div class="products-grid">
        <div class="product-card">
            <div class="product-name">Nintendo Switch Online</div>
            <div class="product-details">ONLINE</div>
            <div class="product-details">8909/01 шт.</div>
        </div>
        <div class="product-card">
            <div class="product-name">Nintendo Switch Online</div>
            <div class="product-details">ONLINE</div>
            <div class="product-details">8909/01 шт.</div>
        </div>
    </div>
    
    <div class="section-title">Топ продаж!</div>
    <div class="single-product">
        <div class="product-name">Koumaphise складки</div>
        <div class="price">1399 P +</div>
    </div>
</body>
</html>

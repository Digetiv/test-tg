<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>GameMini — Магазин видеоигр</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #101018;
      --muted: #aaa;
      --neon: #00e0ff;
      --accent: #8a6bff;
      --transition: 400ms cubic-bezier(.25,.8,.25,1);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      scroll-behavior: smooth;
      touch-action: pan-y;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(20,20,30,0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo { display: flex; align-items: center; gap: 8px; }
    .logo .icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--neon), var(--accent));
      display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: 700;
    }

    .menu-btn { background: none; border: none; color: var(--neon); font-size: 26px; cursor: pointer; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: var(--transition); }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .sidebar {
      position: fixed; right: 0; top: 0; height: 100%; width: 80%;
      max-width: 280px;
      background: rgba(15,15,25,0.98);
      transform: translateX(100%);
      transition: var(--transition);
      padding: 40px 24px;
      display: flex; flex-direction: column; gap: 20px;
      z-index: 11;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar a { color: var(--neon); text-decoration: none; font-weight: 600; }

    main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 30px; }

    .carousel-wrap { position: relative; overflow: hidden; width: 100%; }

    .carousel {
      display: flex;
      gap: 12px;
      will-change: transform;
    }

    .card {
      flex: 0 0 70%;
      max-width: 150px;
      border-radius: 16px;
      background: #14141f;
      overflow: hidden;
      position: relative;
      transition: transform 0.5s ease;
    }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card .meta { padding: 10px; }
    .card .name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .card .price-row { font-size: 13px; }
    .old { text-decoration: line-through; color: var(--muted); margin-right: 6px; }
    .new { color: var(--neon); font-weight: 700; }
    .add-to-cart {
      position: absolute; bottom: 10px; right: 10px;
      background: linear-gradient(135deg, var(--accent), var(--neon));
      border: none; border-radius: 8px;
      width: 36px; height: 36px;
      color: #000; font-size: 18px;
    }

    .about {
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      color: var(--muted);
    }

    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(20,20,30,0.85);
      backdrop-filter: blur(8px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 16px;
      color: var(--neon);
    }
    footer .profile { display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><div class="icon">G</div><div>GameMini</div></div>
    <button class="menu-btn" id="menuBtn">☰</button>
  </header>

  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <a href="#">Главная</a>
    <a href="#catalog">Каталог</a>
    <a href="#about">О нас</a>
    <a href="#contacts">Контакты</a>
  </aside>

  <main>
    <section class="carousel-wrap" id="catalog">
      <div class="carousel" id="carousel"></div>
    </section>

    <section class="about" id="about">
      <h3>О нас</h3>
      <p>GameMini — это магазин видеоигр в Telegram. Мы предлагаем лучшие тайтлы, подписки и скидки в современном мобильном формате.</p>
    </section>
  </main>

  <footer>
    <div class="profile">
      <div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--neon));display:flex;align-items:center;justify-content:center;color:#000;font-weight:700">U</div>
      <div>@player</div>
    </div>
    <div id="cartTotal">0 ₽</div>
  </footer>

  <script>
    const games = [
      {id:1,name:'Hogwarts Legacy',priceOld:2999,priceNew:599,img:'zelda.jpg'},
      {id:2,name:'Zelda Online',priceOld:1290,priceNew:899,img:'Hogwarts.png'},
      {id:3,name:'Metro Redux',priceOld:1990,priceNew:799,img:'zelda.jpg'},
      {id:5,name:'Aether Online',priceOld:1399,priceNew:599,img:'Hogwarts.png'}
    ];

    const carousel = document.getElementById('carousel');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuBtn = document.getElementById('menuBtn');
    const cartTotal = document.getElementById('cartTotal');
    let cart = [];

    function formatPrice(v){ return v.toLocaleString('ru-RU') + ' ₽'; }

    // Создаем дубликаты для плавного бесконечного цикла
    const extendedGames = [...games, ...games, ...games];

    extendedGames.forEach(g=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${g.img}" alt="${g.name}">
        <div class="meta">
          <div class="name">${g.name}</div>
          <div class="price-row"><span class="old">${formatPrice(g.priceOld)}</span><span class="new">${formatPrice(g.priceNew)}</span></div>
        </div>
        <button class="add-to-cart">＋</button>
      `;
      card.querySelector('.add-to-cart').addEventListener('click', e => {
        e.stopPropagation(); addToCart(g);
      });
      carousel.appendChild(card);
    });

    const cards = carousel.children;
    let scrollX = 0;

    function autoScroll() {
      scrollX += 1;
      carousel.style.transform = `translateX(${-scrollX}px)`;
      if (scrollX > (cards[0].offsetWidth + 3) * games.length) {
        scrollX = 0; // сброс для бесконечного цикла
      }
      requestAnimationFrame(autoScroll);
    }
    requestAnimationFrame(autoScroll);

    function addToCart(g){ cart.push(g); const sum = cart.reduce((s,i)=>s+i.priceNew,0); cartTotal.textContent = formatPrice(sum); }

    menuBtn.addEventListener('click', ()=> {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', ()=> {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
